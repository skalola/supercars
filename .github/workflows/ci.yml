name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-only-auth-secret-not-used-in-production
      NEXTAUTH_SECRET: ci-only-auth-secret-not-used-in-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PAYMENT_PROVIDER: ledger
      MAIL_PROVIDER: log

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx prisma validate
      - run: npx prisma db push --skip-generate
      - run: npm run lint:critical
      - run: npm test
      - run: npm run build
